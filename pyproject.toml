[project]
name = "arxivwatcher"
version = "2.0.0"
description = "ArxivWatcher — arXiv 每日论文监控与精读工具，自动抓取、LLM深度解读、邮件推送"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ASLP-lab" }
]
maintainers = [
    { name = "ASLP-lab" }
]
license = { text = "CC BY 4.0" }
keywords = ["arxiv", "watcher", "llm", "paper-digest", "academic", "daily-updates"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "beautifulsoup4>=4.14.0",
    "requests>=2.30.0",
    "pypdf>=6.0.0",
    "markdown>=3.0.0",
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
    "waitress>=3.0.2",
    "bcrypt>=5.0.0",
    "brotli>=1.1.0",
    "ldap3>=2.9.1",
    "pillow>=12.2.0",
    "pymupdf>=1.27.2.3",
]
